services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: aux
      POSTGRES_PASSWORD: aux_dev
      POSTGRES_DB: aux_battles
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - "pgdata:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aux -d aux_battles"]
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  pgdata:
