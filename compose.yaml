services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: aux
      POSTGRES_PASSWORD: aux_dev
      POSTGRES_DB: aux_battles
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - "pgdata:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aux -d aux_battles"]
      interval: 2s
      timeout: 2s
      retries: 15
  migrate:
    build: .
    image: aux-battles-api:dev
    entrypoint: ["/usr/local/bin/goose"]
    command: ["up"]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://aux:aux_dev@db:5432/aux_battles?sslmode=disable
      GOOSE_MIGRATION_DIR: /migrations
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    image: aux-battles-api:dev
    environment:
      DATABASE_URL: postgres://aux:aux_dev@db:5432/aux_battles?sslmode=disable
      MEDIA_ROOT: /data/media
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - "media:/data/media"
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: aux-battles-worker:dev
    init: true
    environment:
      DATABASE_URL: postgres://aux:aux_dev@db:5432/aux_battles?sslmode=disable
      MEDIA_ROOT: /data/media
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_ATTEMPT_TIMEOUT: ${WORKER_ATTEMPT_TIMEOUT:-30m}
    volumes:
      - "media:/data/media"
    depends_on:
      migrate:
        condition: service_completed_successfully
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [observability]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
  grafana:
    image: grafana/grafana:13.3.0
    profiles: [observability]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./observability/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro

volumes:
  pgdata:
  media:
  prometheus_data:
  grafana_data:
