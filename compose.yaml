services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: aux
      POSTGRES_PASSWORD: aux_dev
      POSTGRES_DB: aux_battles
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - "pgdata:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aux -d aux_battles"]
      interval: 2s
      timeout: 2s
      retries: 15
  migrate:
    build: .
    image: aux-battles-api:dev
    entrypoint: ["/usr/local/bin/goose"]
    command: ["up"]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://aux:aux_dev@db:5432/aux_battles?sslmode=disable
      GOOSE_MIGRATION_DIR: /migrations
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    image: aux-battles-api:dev
    environment:
      DATABASE_URL: postgres://aux:aux_dev@db:5432/aux_battles?sslmode=disable
      MEDIA_ROOT: /data/media
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - "media:/data/media"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  pgdata:
  media:
