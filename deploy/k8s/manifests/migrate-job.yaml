apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: aux-battles
  labels:
    app.kubernetes.io/part-of: aux-battles
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: aux-battles
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/kericchhh/aux-battles-api:0.3.0
          command: ["/usr/local/bin/goose", "up"]
          env:
            - name: GOOSE_DRIVER
              value: postgres
            - name: GOOSE_MIGRATION_DIR
              value: /migrations
            - name: GOOSE_DBSTRING
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: uri
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: 
              drop: [ALL]

