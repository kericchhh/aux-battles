apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: aux-battles
  labels:
    app.kubernetes.io/part-of: aux-battles
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: aux-battles
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: aux-battles
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
      containers:
        - name: api
          image: ghcr.io/kericchhh/aux-battles-api:0.3.0
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: media
              mountPath: /data/media
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: uri
            - name: MEDIA_ROOT
              value: /data/media
            - name: LOG_LEVEL
              value: INFO
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
