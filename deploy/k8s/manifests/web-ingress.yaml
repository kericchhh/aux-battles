apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: aux-battles
  labels:
    app.kubernetes.io/part-of: aux-battles
    app.kubernetes.io/component: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
