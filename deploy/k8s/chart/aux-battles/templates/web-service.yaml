apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aux-battles.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/part-of: aux-battles
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
