apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aux-battles.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: aux-battles
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "aux-battles.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      shareProcessNamespace: true
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: tmp
          emptyDir: {}
      containers:
        - name: worker
          image: {{ .Values.image.registry }}/aux-battles-worker:{{ .Values.image.tag | default .Chart.AppVersion }}
          ports:
            - name: metrics
              containerPort: 9091
          volumeMounts:
            - name: media
              mountPath: /data/media
            - name: tmp
              mountPath: /tmp
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: {{ .Values.db.secretKey }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: WORKER_ATTEMPT_TIMEOUT
              value: {{ .Values.worker.attemptTimeout | quote }}
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
