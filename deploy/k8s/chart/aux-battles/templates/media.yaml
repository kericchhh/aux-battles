apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  annotations:
    helm.sh/resource-policy: keep
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aux-battles.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.media.size }}
