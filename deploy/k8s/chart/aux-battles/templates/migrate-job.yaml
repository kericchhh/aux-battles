apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aux-battles.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "aux-battles.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ .Values.image.registry }}/aux-battles-api:{{ .Values.image.tag | default .Chart.AppVersion }}
          command: ["/usr/local/bin/goose", "up"]
          env:
            - name: GOOSE_DRIVER
              value: postgres
            - name: GOOSE_MIGRATION_DIR
              value: /migrations
            - name: GOOSE_DBSTRING
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: {{ .Values.db.secretKey }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: 
              drop: [ALL]

