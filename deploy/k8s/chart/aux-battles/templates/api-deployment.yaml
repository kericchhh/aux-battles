apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aux-battles.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/part-of: aux-battles
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "aux-battles.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
      containers:
        - name: api
          image: {{ .Values.image.registry }}/aux-battles-api:{{ .Values.image.tag | default .Chart.AppVersion }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: media
              mountPath: /data/media
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName }}
                  key: {{ .Values.db.secretKey }}
            - name: MEDIA_ROOT
              value: /data/media
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
