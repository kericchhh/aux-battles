apiVersion: 1
contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: aux_telegram
        type: telegram
        settings:
          bottoken: ${TELEGRAM_BOT_TOKEN}
          chatid: "${TELEGRAM_CHAT_ID}"
        disableResolveMessage: false
policies:
  - orgId: 1
    receiver: telegram
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
