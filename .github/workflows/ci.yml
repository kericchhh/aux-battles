name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: aux
          POSTGRES_PASSWORD: aux_dev
          POSTGRES_DB: aux_battles
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aux -d aux_battles"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://aux:aux_dev@127.0.0.1:5432/aux_battles_server_test?sslmode=disable
      TEST_WORKER_DATABASE_URL: postgres://aux:aux_dev@127.0.0.1:5432/aux_battles_worker_test?sslmode=disable
      PGPASSWORD: aux_dev
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check generated SQL code
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          "$(go env GOPATH)/bin/sqlc" diff

      - name: Build Go commands
        run: go build ./cmd/...

      - name: Vet Go code
        run: go vet ./...

      - name: Install FFmpeg and PostgreSQL client
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql-client

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.28.0

      - name: Create and migrate test databases
        run: |
          createdb -h 127.0.0.1 -p 5432 -U aux aux_battles_server_test
          createdb -h 127.0.0.1 -p 5432 -U aux aux_battles_worker_test
          "$(go env GOPATH)/bin/goose" -dir db/migrations postgres "$TEST_DATABASE_URL" up
          "$(go env GOPATH)/bin/goose" -dir db/migrations postgres "$TEST_WORKER_DATABASE_URL" up

      - name: Test with race detector
        run: go test -race -count=1 ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build web image
        working-directory: .
        run: docker build --file Dockerfile.web .

  observability-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Compose configuration
        run: docker compose --profile observability config --quiet

      - name: Validate Grafana dashboard JSON
        run: python3 -m json.tool 'observability/grafana/dashboards/API & Worker Overview.json' > /dev/null

      - name: Validate Prometheus configuration
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            prom/prometheus:v3.15.1 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Loki configuration
        run: docker compose --profile observability run --rm --no-deps loki -config.file=/etc/loki/config.yml -verify-config

      - name: Validate Alloy configuration
        run: docker compose --profile observability run --rm --no-deps alloy validate /etc/alloy/config.alloy
